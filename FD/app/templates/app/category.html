{% extends 'app/base.html' %}
{% load static %}
{% block title %}{{val}}{% endblock title %}

{% block main-content %}
    <div class="container my-5">
        <div class="row">
            <div class="col-sm-3">
                <div class="list-group">
                    {% for val in title %}
                        <a href="{% url 'category-title' val.title %}" class="list-group-item list-group-item-action" aria-current="true">{{val.title}}</a>
                    {% endfor %}
                </div>
            </div>
            <div class="col-sm-9">
                <div class="row">
                    {% for item in product %}
                        <div class="col text-center mb-4">
                            <a href="{% url 'product-detail' item.id %}" class="btn">
                                <div>
                                    <img src="{{item.product_img.url}}" width="300px" height="200px" />
                                    <div class="fw-bold">{{item.title}}</div>
                                    <div class="fw-bold">${{item.price}}</div>
                                </div>
                            </a>
                        </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
{% endblock main-content %}
